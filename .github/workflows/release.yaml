# Flutter/Dart - Android APK 构建

name: Android Release

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'  # 版本标签触发 Release
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v4
      
      # 2. 设置 Java 环境（Flutter Android 构建需要）
      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # 3. 设置 Flutter 环境（使用稳定版本）
      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true
      
      # 4. 设置 Gradle
      - name: 设置 Gradle
        uses: gradle/gradle-build-action@v2
      
      # 5. 启用 Flutter
      - name: 启用 Flutter
        run: flutter precache --android
      
      # 5. 获取依赖
      - name: 获取依赖
        run: flutter pub get
      
      # 6. 清理并重新生成
      - name: 清理构建
        run: flutter clean
      
      # 7. 获取依赖（清理后）
      - name: 重新获取依赖
        run: flutter pub get
      
      # 8. 诊断信息
      - name: 诊断信息
        run: |
          echo "=== Flutter Doctor ==="
          flutter doctor -v
          echo "=== Gradle Version ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "=== Local Properties ==="
          cat android/local.properties || echo "No local.properties"
      
      # 9. 代码分析（可选，失败不影响构建）
      - name: 代码分析
        run: flutter analyze || true
        continue-on-error: true
      
      # 10. 构建 Debug APK（每次推送都构建）
      - name: 构建 Debug APK
        if: startsWith(github.ref, 'refs/tags/v') == false
        run: flutter build apk --debug --no-tree-shake-icons
      
      # 11. 上传 Debug APK
      - name: 上传 Debug APK
        if: startsWith(github.ref, 'refs/tags/v') == false
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
      
      # 12. 构建 Release APK（仅版本标签）
      - name: 构建 Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter build apk --release --no-tree-shake-icons
      
      # 13. 上传 Release APK
      - name: 上传 Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
      
      # 14. 创建 GitHub Release（仅版本标签）
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
